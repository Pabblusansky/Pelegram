<div class="dashboard">
  <!-- Sidebar with Profile and Chat List -->
  <div class="sidebar">
    <!-- Profile Card -->
    <div class="profile-section">
      <app-profile-card
        [compact]="true"
        [profile]="userProfile"
        (click)="navigateToProfile()"
      ></app-profile-card>
    </div>

    <!-- Chat List -->
    <div class="chat-list-container">
      <app-chat-list (chatSelected)="onChatSelect($event)"></app-chat-list>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Router Outlet for Profile and Other Routes -->
    @if (isProfileRoute) {
      <router-outlet></router-outlet>
    } @else {
      <div class="chat-room-container">
        @if (selectedChatId) {
          <app-chat-room
            [selectedChatId]="selectedChatId"
          ></app-chat-room>
        } @else {
          @if (draftRecipientId) {
            <app-draft-chat
              [recipientId]="draftRecipientId"
            ></app-draft-chat>
          } @else {
            <div class="empty-chat-room">
              <p>Select a chat room to start chatting</p>
            </div>
          }
        }
      </div>
    }

    <!-- Chat Content -->
  </div>
</div>
