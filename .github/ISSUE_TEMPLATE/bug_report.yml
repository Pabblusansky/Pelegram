name: Bug report
description: Something in Pelegram is not working as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security
        vulnerabilities — see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as two users
        2. Open a group chat
        3. ...
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see this?
      options:
        - The live demo (pelegram.netlify.app)
        - A local development setup
        - My own deployment
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Messaging / real-time
        - Authentication
        - Chats and groups
        - Media and uploads
        - Profiles
        - UI / theming
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Only needed for local setups — output of `node -v`
      placeholder: v22.17.0

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Browser console and/or server logs. Redact any tokens.
      render: shell
