version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @angular/compiler-cli and @angular/build 22 require typescript <6.1,
      # and so does typescript-eslint 8.
      - dependency-name: typescript
        versions: ['>=6.1']
      # zone.js 0.16's test patching breaks on Jasmine 7's read-only globals;
      # zone.js itself is tested against jasmine-core 6.3.
      - dependency-name: jasmine-core
        versions: ['>=7']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 requires typescript <6.1.
      - dependency-name: typescript
        versions: ['>=6.1']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      types:
        patterns:
          - '@types/*'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
