version: 2

# Kept deliberately quiet: one monthly run per folder, with every minor and
# patch update in a single PR and major versions in a second one, so a
# risky upgrade never holds back the routine ones. Security updates are not
# delayed by the schedule or the cooldown; they arrive when advisories are
# published, grouped into one PR per folder.

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    # Skip releases younger than a week: they are often followed by a quick
    # fix, and it is a buffer against a compromised publish.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # @angular/compiler-cli and @angular/build 22 require typescript <6.1,
      # and so does typescript-eslint 8.
      - dependency-name: typescript
        versions: ['>=6.1']
      # zone.js 0.16's test patching breaks on Jasmine 7's read-only globals;
      # zone.js itself is tested against jasmine-core 6.3.
      - dependency-name: jasmine-core
        versions: ['>=7']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      client-security:
        applies-to: security-updates
        patterns: ['*']
      client-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      client-major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8 requires typescript <6.1.
      - dependency-name: typescript
        versions: ['>=6.1']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      server-security:
        applies-to: security-updates
        patterns: ['*']
      server-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      server-major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
    groups:
      root:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
